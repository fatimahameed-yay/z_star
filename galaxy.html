/* ── INTRO ───────────────────────────────────────────── */

}
#intro-lines {

}
.il {
  font-family:'Dancing Script',cursive;

#intro-btn {

// ── INTRO: PARTICLE CANVAS ────────────────────────────────────────────────────
(function initIntroParticles() {
  const cv  = document.getElementById('ip');
  const ctx = cv.getContext('2d');
  let W, H, particles;

  function resize() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  particles = Array.from({ length: 90 }, () => ({
    x:  Math.random() * window.innerWidth,
    y:  Math.random() * window.innerHeight,
    r:  0.6 + Math.random() * 2.4,
    vx: (Math.random() - 0.5) * 0.28,
    vy: (Math.random() - 0.5) * 0.28,
    ph: Math.random() * Math.PI * 2,
    sp: 0.35 + Math.random() * 1.1,
    hu: 220 + Math.random() * 95,
    isStar: Math.random() < 0.28,
  }));

  let running = true;
  function draw() {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    const now = Date.now() / 1000;
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -5) p.x = W + 5;
      if (p.x > W + 5) p.x = -5;
      if (p.y < -5) p.y = H + 5;
      if (p.y > H + 5) p.y = -5;

      const a = 0.15 + 0.85 * Math.pow(Math.abs(Math.sin(now * p.sp + p.ph)), 2.2);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = `hsl(${p.hu},80%,78%)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      if (p.isStar && p.r > 1.2) {
        ctx.strokeStyle = `hsl(${p.hu},70%,85%)`;
        ctx.lineWidth = 0.6;
        ctx.globalAlpha = a * 0.55;
        ctx.beginPath();
        ctx.moveTo(p.x - p.r * 2.8, p.y); ctx.lineTo(p.x + p.r * 2.8, p.y);
        ctx.moveTo(p.x, p.y - p.r * 2.8); ctx.lineTo(p.x, p.y + p.r * 2.8);
        ctx.stroke();
      }
      ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();

  // Stop particle loop once intro is gone (save battery)
  document.getElementById('intro-btn').addEventListener('click', () => {
    setTimeout(() => { running = false; }, 1400);
  }, { once: true });
})();

// ── GLOW TEXTURE ─────────────────────────────────────────────────────────────
function mkGlow(size, r, g, b) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const gr  = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  gr.addColorStop(0,    `rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.32, `rgba(${r},${g},${b},0.52)`);
  gr.addColorStop(0.68, `rgba(${r},${g},${b},0.14)`);
  gr.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(cv);
}

// ── TWINKLING STARS (GLSL shader, per-vertex) ─────────────────────────────────
function createTwinkleStars() {
  const N   = 4200;
  const pos = new Float32Array(N * 3);
  const off = new Float32Array(N);
  const sz  = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r = 110 + Math.random() * 230;
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(p) * Math.cos(t);
    pos[i*3+1] = r * Math.sin(p) * Math.sin(t);
    pos[i*3+2] = r * Math.cos(p);
    off[i] = Math.random() * Math.PI * 2;
    sz[i]  = 0.38 + Math.random() * 3.4;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aOff',     new THREE.BufferAttribute(off, 1));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(sz,  1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float aOff; attribute float aSize; uniform float uTime; varying float vA;
      void main() {
        float tw = 0.18 + 0.82 * pow(abs(sin(uTime * 0.9 + aOff)), 2.6);
        vA = tw;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * tw * (188.0 / -mv.z);
        gl_Position  = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying float vA;
      void main() {
        vec2 uv = gl_PointCoord - 0.5; float d = length(uv);
        if (d > 0.5) discard;
        gl_FragColor = vec4(1.0, 0.95, 0.9, (1.0 - d*2.0) * vA);
      }
    `,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  });
  return new THREE.Points(geo, mat);
}

// ── GALAXY (3 spiral arms + halo, inner void r < 9) ──────────────────────────
function createGalaxy() {
  const DISK = 22000, HALO = 4000, N = DISK + HALO;
  const pos  = new Float32Array(N * 3);
  const col  = new Float32Array(N * 3);
  const cC   = new THREE.Color(0xffcc66);
  const cM   = new THREE.Color(0xcc88ff);
  const cR   = new THREE.Color(0x2244dd);
  const cP   = new THREE.Color(0xff55aa);

  for (let i = 0; i < DISK; i++) {
    const arm  = i % 3;
    const aAng = arm * (Math.PI * 2 / 3);
    const r    = 9 + Math.pow(Math.random(), 0.44) * 92;
    const spin = r * 0.27;
    const sc   = Math.pow(Math.random(), 2.2) * 5.8;
    const sA   = Math.random() * Math.PI * 2;
    pos[i*3]   = Math.cos(aAng + spin) * r + Math.cos(sA) * sc;
    pos[i*3+1] = (Math.random() - 0.5) * (0.55 + r * 0.019);
    pos[i*3+2] = Math.sin(aAng + spin) * r + Math.sin(sA) * sc;
    const t = (r - 9) / 92;
    const c = arm === 2 ? cP.clone().lerp(cR, t * 0.8) : cC.clone().lerp(t < 0.5 ? cM : cR, t);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  for (let i = DISK; i < N; i++) {
    const r = 55 + Math.random() * 130;
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(p) * Math.cos(t);
    pos[i*3+1] = r * Math.sin(p) * Math.sin(t);
    pos[i*3+2] = r * Math.cos(p);
    const b = 0.5 + Math.random() * 0.5;
    col[i*3] = b*0.72; col[i*3+1] = b*0.86; col[i*3+2] = b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size:0.19, vertexColors:true, transparent:true, opacity:0.82,
    sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending,
  });
  const g = new THREE.Points(geo, mat);
  g.rotation.x = -0.48; g.rotation.z = 0.12;
  return g;
}

// ── NEBULA CLOUDS ─────────────────────────────────────────────────────────────
function createNebula() {
  const g = new THREE.Group();
  [
    [100,50,180, -30,-15,-38, 55, 0.068],
    [60,30,200,   34, 10,-42, 68, 0.050],
    [180,40,100, -10, 22,-29, 44, 0.058],
    [50,80,160,   22,-22,-52, 78, 0.040],
    [120,50,220,   5,  5,-21, 37, 0.052],
    [200,110,60, -26, -8,-46, 58, 0.034],
  ].forEach(([r,gg,b,x,y,z,s,o]) => {
    const sm = new THREE.SpriteMaterial({ map:mkGlow(128,r,gg,b), transparent:true, opacity:o, blending:THREE.AdditiveBlending, depthWrite:false });
    const sp = new THREE.Sprite(sm);
    sp.scale.set(s,s,1); sp.position.set(x,y,z);
    g.add(sp);
  });
  return g;
}

// ── HEART POSITIONS ───────────────────────────────────────────────────────────
const HS = 0.52, HY = 2.6 * HS;
function heartXY(t) {
  return { x: 16*Math.pow(Math.sin(t),3), y: 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t) };
}
const heartPos = Array.from({length:23}, (_,i) => {
  const { x, y } = heartXY((i/23)*Math.PI*2);
  return new THREE.Vector3(x*HS, y*HS+HY, 0);
});

// ── HEART CONSTELLATION ───────────────────────────────────────────────────────
function createHeart() {
  const group    = new THREE.Group();
  const meshes   = [], glowMats = [], hitZones = [], lineSegs = [];

  for (let i = 0; i < 23; i++) {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.30, 18, 18),
      new THREE.MeshStandardMaterial({ color:0xffffff, emissive:new THREE.Color(0.3,0.42,1.0), emissiveIntensity:0.15, roughness:0.04 })
    );
    mesh.position.copy(heartPos[i]);
    mesh.visible = false;
    mesh.userData.twOff = Math.random() * Math.PI * 2;
    group.add(mesh);
    meshes.push(mesh);

    // Per-star glow sprite
    const gm = new THREE.SpriteMaterial({ map:starGlowTex, transparent:true, opacity:0.12, blending:THREE.AdditiveBlending, depthWrite:false });
    const gs = new THREE.Sprite(gm); gs.scale.set(1.8,1.8,1);
    mesh.add(gs); glowMats.push(gm);

    // Invisible larger hit zone for easy tapping on mobile
    const hz = new THREE.Mesh(
      new THREE.SphereGeometry(0.7, 6, 6),
      new THREE.MeshBasicMaterial({ visible:false })
    );
    mesh.add(hz); hitZones.push(hz);
  }

  // 23 line segments (all start hidden)
  for (let i = 0; i < 23; i++) {
    const j   = (i+1) % 23;
    const geo = new THREE.BufferGeometry().setFromPoints([heartPos[i].clone(), heartPos[j].clone()]);
    const mat = new THREE.LineBasicMaterial({ color:0x9977ff, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending });
    const ln  = new THREE.Line(geo, mat);
    ln.visible = false;
    group.add(ln); lineSegs.push(ln);
  }

  group.visible = false;
  scene.add(group);
  return { group, meshes, glowMats, hitZones, lineSegs };
}

// ── SUN ───────────────────────────────────────────────────────────────────────
function createSun() {
  const group = new THREE.Group();
  const mesh  = new THREE.Mesh(
    new THREE.SphereGeometry(1.15, 36, 36),
    new THREE.MeshStandardMaterial({ color:0xffcc44, emissive:new THREE.Color(1.0,0.48,0.0), emissiveIntensity:1.4, roughness:0.28 })
  );
  mesh.userData.isSun = true; group.add(mesh);

  const gm = new THREE.SpriteMaterial({ map:sunGlowTex, transparent:true, opacity:0.68, blending:THREE.AdditiveBlending, depthWrite:false });
  const gs = new THREE.Sprite(gm); gs.scale.set(7.5,7.5,1); group.add(gs);

  const corona = new THREE.Mesh(
    new THREE.TorusGeometry(1.65,0.055,8,52),
    new THREE.MeshBasicMaterial({ color:0xffaa22, transparent:true, opacity:0.30, depthWrite:false })
  );
  group.add(corona);
  group.add(new THREE.PointLight(0xff9922, 2.5, 42));
  group.position.set(0, 0, 0); group.visible = false;
  scene.add(group);
  return { group, mesh, mat:mesh.material, glowMat:gm, glowSpr:gs, corona };
}

// ── BUILD SCENE ───────────────────────────────────────────────────────────────
const twinkleStars = createTwinkleStars(); scene.add(twinkleStars);
const galaxy = createGalaxy(); scene.add(galaxy);
scene.add(createNebula());
const { group:heartGroup, meshes:heartMeshes, glowMats, hitZones, lineSegs } = createHeart();
const sunObj = createSun();

const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();

// ── STAR ACTIVATION ──────────────────────────────────────────────────────────
function activateStar(idx) {
  currentStar = idx;

  heartMeshes.forEach((m, i) => {
    if (i <= idx && !m.visible) {
      m.visible = true;
      starSpawnTimes[i] = elapsedTime;
      if (i === idx) {
        m.material.emissive.setRGB(1,1,1);
        m.material.emissiveIntensity = 4.2;
        glowMats[i].map = activeGlowTex;
        glowMats[i].color.set(0xffffff);
        glowMats[i].needsUpdate = true;
      }
    } else if (i < idx && m.visible) {
      m.material.emissive.setRGB(0.3,0.42,1.0);
      m.material.emissiveIntensity = 0.55;
      glowMats[i].map = starGlowTex;
      glowMats[i].color.set(0x8888ff);
      glowMats[i].opacity = 0.22;
      glowMats[i].needsUpdate = true;
    }
  });

  lineSegs.forEach((l, i) => {
    const show = (i < 22) ? (idx > i) : (idx >= 23);
    if (show && !l.visible) {
      l.visible = true;
      lineSpawnTimes[i] = elapsedTime;
      l.material.opacity = 0;
    }
  });

  if (idx < 23) {
    sunObj.mat.emissiveIntensity = 0.72;
    sunObj.glowMat.opacity = 0.30;
    setHint(`✦ star ${idx+1} of 23 — click the brightest one ✦`);
  } else {
    sunObj.mat.emissiveIntensity = 4.2;
    sunObj.glowMat.opacity = 1.0;
    setHint('✦ now click the sun ✦');
  }
}

function setHint(t) {
  const h = document.getElementById('hint');
  h.textContent = t; h.style.display = 'block';
}

// ── JOURNEY START ─────────────────────────────────────────────────────────────
function startJourney() {
  const intro = document.getElementById('intro');
  intro.style.transition = 'opacity 1.3s ease';
  intro.style.opacity = '0';
  setTimeout(() => {
    intro.style.display = 'none';
    journeyStarted = true;
    heartGroup.visible = true;
    sunObj.group.visible = true;
    activateStar(0);
  }, 1300);
}

// ── POINTER HANDLER (click + touch) ──────────────────────────────────────────
function handlePointer(cx, cy) {
  if (!journeyStarted || modalOpen) return;
  mouse.x =  (cx / window.innerWidth)  * 2 - 1;
  mouse.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  if (currentStar < 23) {
    // Raycast against the invisible hit zone (bigger = easier to tap)
    if (raycaster.intersectObject(hitZones[currentStar]).length) openReason(currentStar);
  } else {
    if (raycaster.intersectObject(sunObj.mesh).length) openSunModal();
  }
}

canvas.addEventListener('click', e => handlePointer(e.clientX, e.clientY));
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  handlePointer(t.clientX, t.clientY);
}, { passive:false });

canvas.addEventListener('mousemove', e => {
  if (!journeyStarted || modalOpen) return;
  mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const target = currentStar < 23 ? hitZones[currentStar] : sunObj.mesh;
  canvas.style.cursor = raycaster.intersectObject(target).length ? 'pointer' : 'default';
});

// ── MODALS ────────────────────────────────────────────────────────────────────
function openReason(idx) {
  modalOpen = true;
  // Reset animation so it replays cleanly
  const box = document.getElementById('modal-box');
  box.style.animation = 'none';
  void box.offsetWidth;
  box.style.animation = '';

  document.getElementById('modal-num-big').textContent   = String(idx+1).padStart(2,'0');
  document.getElementById('modal-num-label').textContent = 'reason i love about you';
  document.getElementById('modal-text').textContent      = REASONS[idx];
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  modalOpen = false;
  // Clear old content only after transition ends
  setTimeout(() => {
    if (!modalOpen) {
      document.getElementById('modal-text').textContent = '';
      document.getElementById('modal-num-big').textContent = '00';
    }
  }, 340);
  activateStar(currentStar + 1);
}

function openSunModal() {
  modalOpen = true;
  const box = document.getElementById('sun-box');
  box.style.animation = 'none';
  void box.offsetWidth;
  box.style.animation = '';
  document.getElementById('sun-modal').classList.add('show');
}

function closeSunModal() {
  document.getElementById('sun-modal').classList.remove('show');
  modalOpen = false;
}

// ── ANIMATION LOOP ────────────────────────────────────────────────────────────
function easeOut3(x) { return 1 - Math.pow(1 - Math.min(x,1), 3); }

function animate() {
  requestAnimationFrame(animate);
  elapsedTime += 0.007;

  twinkleStars.material.uniforms.uTime.value = elapsedTime;
  galaxy.rotation.y = elapsedTime * 0.032;

  // Heart stars — spawn animation + active pulse
  heartMeshes.forEach((m, i) => {
    if (!m.visible) return;
    const spawnP = easeOut3((elapsedTime - starSpawnTimes[i]) / 0.28);
    const tw     = Math.sin(elapsedTime * 1.9 + m.userData.twOff);

    if (journeyStarted && i === currentStar && currentStar < 23) {
      const pulse = 1.78 + 0.22 * Math.sin(elapsedTime * 5.8);
      m.scale.setScalar(spawnP * pulse);
      m.material.emissiveIntensity = spawnP * (3.8 + tw * 0.7);
      glowMats[i].opacity = spawnP * (0.80 + tw * 0.12);
    } else if (i < currentStar) {
      m.scale.setScalar(spawnP);
      m.material.emissiveIntensity = spawnP * (0.52 + tw * 0.14);
      glowMats[i].opacity = spawnP * 0.22;
    }
  });

  // Lines — fade in
  lineSegs.forEach((l, i) => {
    if (!l.visible) return;
    l.material.opacity = easeOut3((elapsedTime - lineSpawnTimes[i]) / 0.38) * 0.48;
  });

  // Sun
  if (sunObj.group.visible) {
    const sp = Math.sin(elapsedTime * 2.8);
    sunObj.group.rotation.y += 0.006;
    sunObj.corona.rotation.z -= 0.003;
    if (currentStar >= 23) {
      sunObj.mat.emissiveIntensity = 3.5 + sp * 0.9;
      sunObj.mesh.scale.setScalar(1 + sp * 0.06);
      sunObj.glowMat.opacity = 0.88 + sp * 0.08;
      sunObj.glowSpr.scale.set(9 + sp*0.7, 9 + sp*0.7, 1);
    } else {
      sunObj.mat.emissiveIntensity = 0.72 + sp * 0.15;
    }
  }

  // Camera drift
  camera.position.x = Math.sin(elapsedTime * 0.038) * 2.5;
  camera.position.y = 2 + Math.cos(elapsedTime * 0.027) * 1.4;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

// ── RESIZE ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  setCameraForAspect();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
